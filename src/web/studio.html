<div id="fractal-hatching">
  <div class="viz-controls">
    <label class="form-label"
      >Study
      <select class="form-select" data-control="scene">
        <option value="3" selected>Pencil city</option>
        <option value="4">City + traffic</option>
        <option value="0">Sculpture & cast shadows</option>
        <option value="1">Flat surface</option>
        <option value="2">Tone ramp</option>
      </select>
    </label>
    <label class="form-label"
      >Technique
      <select class="form-select" data-control="method">
        <option value="0">Pencil · nested strokes</option>
        <option value="1">Nested engraving</option>
        <option value="2">Fixed surface texture</option>
      </select>
    </label>
  </div>
  <canvas
    role="img"
    aria-label="Live shader study of nested fractal hatching. Drag to orbit the city or sculpture or pan the flat surface; use the zoom slider to inspect scale transitions."
  ></canvas>
  <div class="viz-controls">
    <label class="form-label"
      >Zoom <span class="tabular-nums" data-zoom-value>1.00×</span
      ><input
        class="form-range"
        data-control="zoom"
        type="range"
        min="-2"
        max="6"
        step="0.005"
        value="0"
    /></label>
    <label class="form-label"
      ><span data-light-label>Light direction</span>
      <span class="tabular-nums" data-light-value>126°</span
      ><input
        class="form-range"
        data-control="light"
        type="range"
        min="0"
        max="1"
        step="0.005"
        value="0.35"
    /></label>
  </div>
  <div class="viz-controls">
    <label class="form-label"
      >Screen-space outlines
      <select class="form-select" data-control="outline">
        <option value="0">Off</option>
        <option value="1">Stable fit</option>
        <option value="2" selected>Pencil fit</option>
        <option value="3">Lines only</option>
      </select>
    </label>
    <label class="form-label"
      >Pencil jitter <span class="tabular-nums" data-jitter-value>0.65 px</span
      ><input
        class="form-range"
        data-control="jitter"
        type="range"
        min="0"
        max="1.2"
        step="0.05"
        value="0.65"
    /></label>
  </div>
  <div class="viz-controls">
    <label class="form-label"
      >View
      <select class="form-select" data-control="view">
        <option value="0" selected>Pencil drawing</option>
        <option value="1">Raw shadows</option>
        <option value="2">Light only</option>
      </select> </label
    ><label class="form-label"
      >Rendering
      <select class="form-select" data-control="quality">
        <option value="1" selected>Fast · two pencil samples</option>
        <option value="0">Reference · four pencil samples</option>
      </select>
    </label>
  </div>
  <div class="viz-row">
    <label class="form-check"
      ><input
        class="form-check-input"
        data-control="hold"
        type="checkbox"
        checked
      /><span class="form-check-label">Hold drawings · 10 fps</span></label
    >
    <label class="form-check"
      ><input
        class="form-check-input"
        data-control="traffic"
        type="checkbox"
        checked
        disabled
      /><span class="form-check-label">Traffic</span></label
    >
    <button class="btn" type="button" data-play-kind="zoom">Play zoom</button>
    <button class="btn" type="button" data-play-kind="light" data-play>
      Play light
    </button>
    <span class="text-small text-muted" data-status aria-live="polite"></span>
  </div>
  <style>
    #fractal-hatching canvas {
      display: block;
      width: 100%;
      height: 400px;
      touch-action: none;
      cursor: grab;
    }
    #fractal-hatching canvas:active {
      cursor: grabbing;
    }
    @media (max-width: 480px) {
      #fractal-hatching canvas {
        height: 330px;
      }
    }
  </style>
  <script type="x-shader/x-fragment" data-fragment>
    SHADER_INSERT
  </script>
  <script type="x-shader/x-fragment" data-pencil-core>
    PENCIL_CORE_TEXT
  </script>
  <script type="x-shader/x-fragment" data-edge-fragment>
    EDGE_PASS_TEXT
  </script>
  <script type="x-shader/x-fragment" data-composite-fragment>
    COMPOSITE_PASS_TEXT
  </script>
  <script>
    JS_INSERT;
  </script>
</div>
